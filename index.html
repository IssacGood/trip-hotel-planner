<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程訂房看板 · 1/23–1/31</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1f2a24;
    --paper:#f6f3ea;
    --line:#d9d2bd;
    --moss:#3f5c46;
    --moss-dk:#2b4232;
    --clay:#b5583a;
    --gold:#c39a3f;
    --card:#ffffff;
    --muted:#7a7466;
    --chosen:#e9f2e6;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:var(--moss-dk);
    color:#f3efe2;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{
    font-size:1.15rem; margin:0; font-weight:700; letter-spacing:.02em;
    display:flex; align-items:baseline; gap:8px;
  }
  header h1 small{font-weight:400; opacity:.75; font-size:.75rem;}
  .header-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .guests-box{display:flex; align-items:center; gap:6px; font-size:.82rem;}
  .guests-box input{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35);
    color:#fff; padding:5px 8px; border-radius:6px; font-size:.85rem; width:52px; text-align:center;
  }
  .btn{
    border:none; border-radius:6px; padding:7px 12px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn-clay{background:var(--clay); color:#fff;}
  .btn-gold{background:var(--gold); color:#2b2410;}
  .status-dot{width:8px; height:8px; border-radius:50%; background:#8fbf8f; display:inline-block; margin-right:5px;}

  #summary{
    margin:16px 18px 0; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px;
  }
  #summary h2{margin:0 0 10px; font-size:.95rem; color:var(--moss-dk); letter-spacing:.03em;}
  #summary-grid{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .sum-item{
    flex:0 0 auto; min-width:118px; border-left:3px solid var(--gold);
    background:var(--chosen); border-radius:6px; padding:8px 10px; font-size:.78rem;
  }
  .sum-item.empty{border-left-color:var(--line); background:#faf9f4; color:var(--muted);}
  .sum-date{font-weight:700; color:var(--moss-dk); font-size:.8rem;}
  .sum-hotel{margin-top:3px; font-weight:600;}
  .sum-price{color:var(--clay); font-weight:700; margin-top:2px;}
  #grand-total-line{margin-top:10px; font-size:.85rem; display:flex; gap:18px; flex-wrap:wrap;}
  #grand-total-line b{color:var(--clay); font-size:1rem;}

  #layout{
    display:flex; gap:14px; padding:16px 18px 40px; align-items:flex-start;
  }
  #board{
    display:flex; gap:12px; overflow-x:auto; flex:1; min-width:0;
    scroll-snap-type:x proximity; padding-bottom:8px;
  }
  #pool-panel{
    flex:0 0 300px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; max-height:calc(100vh - 200px); position:sticky; top:78px;
  }
  #pool-panel .day-head{
    display:flex; justify-content:space-between; align-items:center;
  }
  .day-col{
    flex:0 0 250px; scroll-snap-align:start;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; max-height:calc(100vh - 200px);
  }
  .day-head{
    padding:10px 12px; border-bottom:2px solid var(--moss);
    background:linear-gradient(180deg,#fff,#faf8f0);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  #pool-panel .day-head{border-bottom-color:var(--gold);}
  .day-head .d1{font-weight:800; color:var(--moss-dk); font-size:1rem;}
  .day-head .d2{font-size:.72rem; color:var(--muted);}
  .col-section{padding:8px 10px; overflow-y:auto; flex:1;}
  .col-section h3{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:6px 2px; display:flex; justify-content:space-between; align-items:center;
  }
  .add-mini{
    background:var(--moss); border:none; color:#fff;
    border-radius:6px; padding:5px 10px; cursor:pointer; font-size:.75rem; font-weight:700;
  }
  .drop-zone{min-height:60px;}
  .drop-zone.empty-hint::before{
    content:"拖曳飯店卡片到這裡";
    display:block; text-align:center; font-size:.72rem; color:#c7c0a9;
    border:1.5px dashed var(--line); border-radius:8px; padding:16px 4px; margin-top:2px;
  }

  .hotel-card, .plan-card{
    background:#fffdf8; border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; margin-bottom:8px; cursor:grab; position:relative;
    transition:box-shadow .15s, border-color .15s;
  }
  .hotel-card:hover, .plan-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .hotel-card.chosen{border-color:var(--moss); background:var(--chosen);}
  .hotel-card.chosen::before{
    content:"✅ 已選定"; font-size:.68rem; color:var(--moss-dk); font-weight:700;
    display:block; margin-bottom:3px;
  }
  .card-title{font-weight:700; font-size:.88rem; color:var(--ink); word-break:break-word;}
  .card-sub{font-size:.75rem; color:var(--muted); margin-top:2px;}
  .card-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px;}
  .tag{font-size:.68rem; background:#eef0e6; color:var(--moss-dk); border-radius:4px; padding:2px 6px;}
  .price-tag{font-size:.85rem; font-weight:800; color:var(--clay); margin-top:6px;}
  .price-tag .orig{font-size:.68rem; color:var(--muted); font-weight:500; display:block; margin-top:1px;}
  .card-actions{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .card-actions button{
    font-size:.68rem; border:none; background:#eee; border-radius:5px; padding:3px 7px; cursor:pointer;
  }
  .card-actions .pick-btn{background:var(--moss); color:#fff;}
  .card-actions .del-btn{background:#f3e2dd; color:var(--clay);}
  .card-actions a{font-size:.68rem; color:#2f6fb0; align-self:center;}
  .pc-time{font-size:.68rem; color:var(--moss-dk); font-weight:700;}

  .sortable-ghost{opacity:.35;}
  .sortable-drag{cursor:grabbing;}

  dialog{
    border:none; border-radius:12px; padding:0; width:min(440px,92vw);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  dialog::backdrop{background:rgba(20,20,15,.45);}
  .modal-inner{padding:20px 22px;}
  .modal-inner h3{margin:0 0 14px; color:var(--moss-dk);}
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:.75rem; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=url], .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:.85rem;
    font-family:inherit; background:#fdfcf8;
  }
  .field textarea{resize:vertical; min-height:44px;}
  .row2{display:flex; gap:10px;}
  .row2 > .field{flex:1;}
  .checks{display:flex; gap:16px; align-items:center; margin-top:4px;}
  .checks label{display:flex; align-items:center; gap:5px; font-size:.8rem; color:var(--ink); font-weight:500;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .modal-actions button{padding:8px 16px; border-radius:6px; border:none; font-weight:600; cursor:pointer; font-size:.85rem;}
  .cancel-btn{background:#eee; color:#555;}
  .save-btn{background:var(--moss); color:#fff;}

  #config-banner{
    margin:14px 18px 0; background:#fff4e6; border:1px solid #e6c78a; border-radius:8px;
    padding:10px 14px; font-size:.8rem; color:#7a5417; display:none;
  }
  #config-banner code{background:#fff; padding:1px 5px; border-radius:4px;}

  @media (max-width:900px){
    #layout{flex-direction:column;}
    #pool-panel{flex:1 1 auto; width:100%; position:static; max-height:none;}
    #board{width:100%;}
  }
  @media (max-width:600px){
    .day-col{flex:0 0 78vw;}
    header h1{font-size:1rem;}
  }
</style>
</head>
<body>

<header>
  <h1>🗺️ 旅程訂房看板 <small>1/23 – 1/31</small></h1>
  <div class="header-right">
    <span style="font-size:.78rem;"><span class="status-dot" id="statusDot"></span><span id="statusText">連線中…</span></span>
    <div class="guests-box">
      <span>總人數</span>
      <input id="guestsInput" type="number" min="1" value="8">
      <span>人</span>
    </div>
    <button class="btn btn-gold" id="exportBtn">📋 複製總覽</button>
  </div>
</header>

<div id="config-banner">
  ⚠️ 尚未設定 Firebase,資料不會同步保存。請打開 <code>index.html</code>,把 <code>firebaseConfig</code> 換成你自己 Firebase 專案的設定值。
</div>

<div id="summary">
  <h2>✅ 目前住宿總覽（已選定的飯店，已換算成全員人數金額）</h2>
  <div id="summary-grid"></div>
  <div id="grand-total-line">
    <span>已選天數：<b id="chosen-count">0</b> / 9</span>
    <span>住宿總金額（<span id="total-guests-label">8</span> 人）：$<b id="total-price">0</b></span>
  </div>
</div>

<div id="layout">
  <div id="board"></div>

  <div id="pool-panel">
    <div class="day-head">
      <div>
        <div class="d1">🏨 飯店資料庫</div>
        <div class="d2">新增後拖到左邊日期</div>
      </div>
      <button class="add-mini" id="addHotelPool">＋ 新增飯店</button>
    </div>
    <div class="col-section">
      <div class="drop-zone" id="poolZone" data-date=""></div>
    </div>
  </div>
</div>

<!-- 飯店編輯視窗 -->
<dialog id="hotelDialog">
  <form class="modal-inner" method="dialog" id="hotelForm">
    <h3 id="hotelDialogTitle">新增飯店候選</h3>
    <input type="hidden" id="h_id">
    <div class="field">
      <label>飯店名稱</label>
      <input type="text" id="h_name" required placeholder="例如：花蓮理想大地">
    </div>
    <div class="row2">
      <div class="field">
        <label>此價格是幾人份？</label>
        <input type="number" id="h_capacity" min="1" placeholder="例如：2" required>
      </div>
      <div class="field">
        <label>該人數的總價</label>
        <input type="number" id="h_price" min="0" placeholder="新台幣">
      </div>
    </div>
    <div class="field checks">
      <label><input type="checkbox" id="h_breakfast"> 含早餐</label>
      <label><input type="checkbox" id="h_dinner"> 含晚餐</label>
    </div>
    <div class="field">
      <label>飯店介紹／官網連結</label>
      <input type="url" id="h_link" placeholder="https://...">
    </div>
    <div class="field">
      <label>訂房連結（agoda / booking 等）</label>
      <input type="url" id="h_bookingLink" placeholder="https://...">
    </div>
    <div class="row2">
      <div class="field">
        <label>👍 優點</label>
        <textarea id="h_pros" placeholder="例如：近車站、有停車場"></textarea>
      </div>
      <div class="field">
        <label>👎 缺點</label>
        <textarea id="h_cons" placeholder="例如：房間偏小"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="cancel-btn" id="hotelCancel">取消</button>
      <button type="submit" class="save-btn">儲存</button>
    </div>
  </form>
</dialog>

<script>
/* ============ 1. Firebase 設定 ============ */
const firebaseConfig = {
  apiKey: "AIzaSyA50pTthgi-13w36Dcjte6ChUcGcKJlqF0",
  authDomain: "trip-hotel-planner.firebaseapp.com",
  projectId: "trip-hotel-planner",
  storageBucket: "trip-hotel-planner.firebasestorage.app",
  messagingSenderId: "331719613724",
  appId: "1:331719613724:web:d46512cf2df71ef4fe2ed9",
  measurementId: "G-Y3XTRFYR6P"
};

const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
if (isConfigured) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} else {
  document.getElementById('config-banner').style.display = 'block';
  document.getElementById('statusText').textContent = '未連接資料庫（本機模式）';
  document.getElementById('statusDot').style.background = '#c98a4b';
}

/* ============ 2. 日期範圍 ============ */
const DATES = ["1/23","1/24","1/25","1/26","1/27","1/28","1/29","1/30","1/31"];
const WEEK = ["五","六","日","一","二","三","四","五","六"];
let hotels = [];      // 扁平陣列: {id,name,capacity,price,breakfast,dinner,link,bookingLink,pros,cons,chosen,assignedDate:null|"1/23"}
let totalGuests = 8;

/* ============ 3. 本機儲存 fallback ============ */
const LOCAL_KEY = 'trip_planner_local_v2';
function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw){ const d = JSON.parse(raw); hotels = d.hotels || []; totalGuests = d.totalGuests || 8; }
  }catch(e){}
}
function saveLocal(){ localStorage.setItem(LOCAL_KEY, JSON.stringify({hotels, totalGuests})); }

/* ============ 4. Firestore 讀寫 ============ */
function watchFirestore(){
  db.collection('trip_data').doc('hotelsFlat').onSnapshot(snap=>{
    if(snap.exists){ hotels = snap.data().list || []; render(); }
  });
  db.collection('trip_data').doc('settings').onSnapshot(snap=>{
    if(snap.exists && snap.data().totalGuests){ totalGuests = snap.data().totalGuests; render(); }
  });
  document.getElementById('statusText').textContent = '即時同步中';
}
function persist(){
  if(isConfigured && db){
    db.collection('trip_data').doc('hotelsFlat').set({list: hotels});
    db.collection('trip_data').doc('settings').set({totalGuests}, {merge:true});
  } else {
    saveLocal();
  }
  render();
}

/* ============ 5. Render ============ */
const board = document.getElementById('board');
const poolZone = document.getElementById('poolZone');

function adjustedPrice(h){
  const cap = Number(h.capacity)||0;
  const price = Number(h.price)||0;
  if(!cap) return price;
  return Math.round(price / cap * totalGuests);
}

function render(){
  document.getElementById('guestsInput').value = totalGuests;
  document.getElementById('total-guests-label').textContent = totalGuests;

  board.innerHTML = '';
  DATES.forEach((d, idx) => {
    const col = document.createElement('div');
    col.className = 'day-col';
    col.innerHTML = `
      <div class="day-head">
        <div class="d1">${d}　<span style="color:var(--clay);">（週${WEEK[idx]}）</span></div>
        <div class="d2">Day ${idx+1}</div>
      </div>
      <div class="col-section">
        <div class="drop-zone" data-date="${d}"></div>
      </div>
    `;
    board.appendChild(col);
    const zone = col.querySelector('.drop-zone');
    const list = hotels.filter(h => h.assignedDate === d);
    if(list.length===0) zone.classList.add('empty-hint');
    list.forEach(h => zone.appendChild(renderHotelCard(h)));
    new Sortable(zone, { group:'hotelsShared', animation:150, onAdd:onDrop, onRemove:onDrop, onEnd:onDrop });
  });

  poolZone.innerHTML = '';
  const poolList = hotels.filter(h => !h.assignedDate);
  if(poolList.length===0) poolZone.classList.add('empty-hint'); else poolZone.classList.remove('empty-hint');
  poolList.forEach(h => poolZone.appendChild(renderHotelCard(h)));
  new Sortable(poolZone, { group:'hotelsShared', animation:150, onAdd:onDrop, onRemove:onDrop, onEnd:onDrop });

  renderSummary();
}

function onDrop(){
  // 依照每個 zone 目前的卡片順序與所屬 data-date 更新 assignedDate
  const zones = document.querySelectorAll('.drop-zone');
  const newHotels = [...hotels];
  zones.forEach(zone => {
    const date = zone.dataset.date || null;
    [...zone.children].forEach(card => {
      const h = newHotels.find(x => x.id === card.dataset.id);
      if(h) h.assignedDate = date;
    });
  });
  hotels = newHotels;
  persist();
}

function renderHotelCard(h){
  const el = document.createElement('div');
  el.className = 'hotel-card' + (h.chosen ? ' chosen' : '');
  el.dataset.id = h.id;
  const metaBits = [];
  if(h.capacity) metaBits.push(`<span class="tag">👥 原價 ${h.capacity}人份</span>`);
  if(h.breakfast) metaBits.push(`<span class="tag">🍳 含早餐</span>`);
  if(h.dinner) metaBits.push(`<span class="tag">🍽️ 含晚餐</span>`);
  const adj = adjustedPrice(h);
  el.innerHTML = `
    <div class="card-title">${escapeHtml(h.name)}</div>
    <div class="card-meta">${metaBits.join('')}</div>
    ${h.price ? `<div class="price-tag">$${adj.toLocaleString()}（${totalGuests}人）
        <span class="orig">原價 $${Number(h.price).toLocaleString()} / ${h.capacity||'?'}人</span>
      </div>` : ''}
    ${h.pros ? `<div class="card-sub">👍 ${escapeHtml(h.pros)}</div>` : ''}
    ${h.cons ? `<div class="card-sub">👎 ${escapeHtml(h.cons)}</div>` : ''}
    <div class="card-actions">
      ${h.link ? `<a href="${escapeAttr(h.link)}" target="_blank" rel="noopener">介紹</a>` : ''}
      ${h.bookingLink ? `<a href="${escapeAttr(h.bookingLink)}" target="_blank" rel="noopener">訂房</a>` : ''}
      ${h.assignedDate ? `<button class="pick-btn" data-pick="${h.id}">${h.chosen ? '取消選定' : '選這間'}</button>` : ''}
      <button data-edit-hotel="${h.id}">編輯</button>
      <button class="del-btn" data-del-hotel="${h.id}">刪除</button>
    </div>
  `;
  el.querySelector('[data-edit-hotel]').onclick = () => openHotelDialog(h);
  el.querySelector('[data-del-hotel]').onclick = () => { if(confirm(`確定刪除「${h.name}」嗎？`)) deleteHotel(h.id); };
  const pickBtn = el.querySelector('[data-pick]');
  if(pickBtn) pickBtn.onclick = () => toggleChosen(h.id);
  return el;
}

function renderSummary(){
  const grid = document.getElementById('summary-grid');
  grid.innerHTML = '';
  let count = 0, total = 0;
  DATES.forEach((d, idx) => {
    const chosen = hotels.find(h => h.assignedDate === d && h.chosen);
    const item = document.createElement('div');
    if(chosen){
      count++; total += adjustedPrice(chosen);
      item.className = 'sum-item';
      item.innerHTML = `<div class="sum-date">${d}（週${WEEK[idx]}）</div><div class="sum-hotel">${escapeHtml(chosen.name)}</div><div class="sum-price">$${adjustedPrice(chosen).toLocaleString()}</div>`;
    } else {
      item.className = 'sum-item empty';
      item.innerHTML = `<div class="sum-date">${d}（週${WEEK[idx]}）</div><div>尚未選定</div>`;
    }
    grid.appendChild(item);
  });
  document.getElementById('chosen-count').textContent = count;
  document.getElementById('total-price').textContent = total.toLocaleString();
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ============ 6. CRUD ============ */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function upsertHotel(data){
  const idx = hotels.findIndex(h => h.id === data.id);
  if(idx >= 0) hotels[idx] = {...hotels[idx], ...data}; else hotels.push(data);
  persist();
}
function deleteHotel(id){
  hotels = hotels.filter(h => h.id !== id);
  persist();
}
function toggleChosen(id){
  hotels.forEach(h => { if(h.id === id) h.chosen = !h.chosen; });
  persist();
}

/* ============ 7. 對話框 ============ */
const hotelDialog = document.getElementById('hotelDialog');
const hotelForm = document.getElementById('hotelForm');
document.getElementById('hotelCancel').onclick = () => hotelDialog.close();
document.getElementById('addHotelPool').onclick = () => openHotelDialog(null);

function openHotelDialog(h){
  document.getElementById('hotelDialogTitle').textContent = h ? '編輯飯店' : '新增飯店';
  document.getElementById('h_id').value = h ? h.id : uid();
  document.getElementById('h_name').value = h ? h.name : '';
  document.getElementById('h_capacity').value = h ? (h.capacity||'') : '';
  document.getElementById('h_price').value = h ? (h.price||'') : '';
  document.getElementById('h_breakfast').checked = h ? !!h.breakfast : false;
  document.getElementById('h_dinner').checked = h ? !!h.dinner : false;
  document.getElementById('h_link').value = h ? (h.link||'') : '';
  document.getElementById('h_bookingLink').value = h ? (h.bookingLink||'') : '';
  document.getElementById('h_pros').value = h ? (h.pros||'') : '';
  document.getElementById('h_cons').value = h ? (h.cons||'') : '';
  hotelDialog.showModal();
}
hotelForm.addEventListener('submit', () => {
  const id = document.getElementById('h_id').value;
  const existing = hotels.find(x => x.id === id);
  const data = {
    id,
    assignedDate: existing ? existing.assignedDate : null,
    chosen: existing ? existing.chosen : false,
    name: document.getElementById('h_name').value.trim(),
    capacity: document.getElementById('h_capacity').value,
    price: document.getElementById('h_price').value,
    breakfast: document.getElementById('h_breakfast').checked,
    dinner: document.getElementById('h_dinner').checked,
    link: document.getElementById('h_link').value.trim(),
    bookingLink: document.getElementById('h_bookingLink').value.trim(),
    pros: document.getElementById('h_pros').value.trim(),
    cons: document.getElementById('h_cons').value.trim()
  };
  upsertHotel(data);
});

/* ============ 8. 總人數設定 ============ */
const guestsInput = document.getElementById('guestsInput');
guestsInput.addEventListener('change', () => {
  totalGuests = Math.max(1, parseInt(guestsInput.value)||8);
  persist();
});

/* ============ 9. 匯出 ============ */
document.getElementById('exportBtn').onclick = () => {
  let text = `📌 旅程住宿總覽 (1/23–1/31，${totalGuests}人)\n\n`;
  DATES.forEach((d, idx) => {
    const chosen = hotels.find(h => h.assignedDate === d && h.chosen);
    text += `${d}（週${WEEK[idx]}）：` + (chosen ? `${chosen.name}（$${adjustedPrice(chosen).toLocaleString()}）` : '尚未選定') + `\n`;
  });
  navigator.clipboard.writeText(text).then(()=> alert('已複製到剪貼簿！可以貼到 LINE 群組。'));
};

/* ============ 10. 啟動 ============ */
if(isConfigured && db){
  watchFirestore();
} else {
  loadLocal();
  render();
}
</script>
</body>
</html>
