<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程訂房看板 · 1/23–1/31</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1f2a24;
    --paper:#f6f3ea;
    --line:#d9d2bd;
    --moss:#3f5c46;
    --moss-dk:#2b4232;
    --clay:#b5583a;
    --gold:#c39a3f;
    --card:#ffffff;
    --muted:#7a7466;
    --chosen:#e9f2e6;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:var(--moss-dk);
    color:#f3efe2;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{
    font-size:1.15rem; margin:0; font-weight:700; letter-spacing:.02em;
    display:flex; align-items:baseline; gap:8px;
  }
  header h1 small{font-weight:400; opacity:.75; font-size:.75rem;}
  .header-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .guests-box{display:flex; align-items:center; gap:6px; font-size:.82rem;}
  .guests-box input{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35);
    color:#fff; padding:5px 8px; border-radius:6px; font-size:.85rem; width:52px; text-align:center;
  }
  .btn{
    border:none; border-radius:6px; padding:7px 12px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn-clay{background:var(--clay); color:#fff;}
  .btn-gold{background:var(--gold); color:#2b2410;}
  .status-dot{width:8px; height:8px; border-radius:50%; background:#8fbf8f; display:inline-block; margin-right:5px;}

  .total-box{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
    border-radius:6px; padding:6px 12px; font-size:.82rem; color:#f3efe2;
  }
  .total-box b{color:var(--gold); font-size:.95rem;}

  #layout{
    display:flex; gap:14px; padding:16px 18px 40px; align-items:flex-start;
  }
  #board{
    display:flex; flex-direction:column; gap:12px; flex:1; min-width:0; padding-bottom:8px;
  }
  #pool-panel{
    flex:0 0 300px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; max-height:calc(100vh - 100px); position:sticky; top:78px;
  }
  #pool-panel .day-head{
    display:flex; justify-content:space-between; align-items:center;
  }
  .day-col{
    display:flex; align-items:stretch;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden;
  }
  .day-head{
    padding:10px 12px; border-bottom:2px solid var(--moss);
    background:linear-gradient(180deg,#fff,#faf8f0);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  #pool-panel .day-head{border-bottom-color:var(--gold);}
  .day-head .d1{font-weight:800; color:var(--moss-dk); font-size:1rem;}
  .day-head .d2{font-size:.72rem; color:var(--muted);}

  .day-side{
    flex:0 0 108px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:10px 8px; text-align:center; border-right:2px solid var(--moss);
    background:linear-gradient(180deg,#fff,#faf8f0);
  }
  .day-side .d1{font-weight:800; color:var(--moss-dk); font-size:1.05rem; line-height:1.3;}
  .day-side .d2{font-size:.72rem; color:var(--muted);}
  .day-body{flex:1; display:flex; min-width:0;}
  .day-section{flex:1; padding:10px 14px; border-right:1px solid var(--line); min-width:0;}
  .day-section:last-child{border-right:none;}

  .col-section{padding:8px 10px; overflow-y:auto; overflow-x:hidden; flex:1;}
  .col-section h3, .day-section h3{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:0 2px 8px; display:flex; justify-content:space-between; align-items:center;
  }
  .add-mini{
    background:var(--moss); border:none; color:#fff;
    border-radius:6px; padding:5px 10px; cursor:pointer; font-size:.75rem; font-weight:700;
  }
  .drop-zone{min-height:50px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;}
  #pool-panel .drop-zone{display:block;}
  .hotel-card{flex:0 0 220px;}
  .drop-zone.empty-hint::before{
    content:"拖曳飯店卡片到這裡";
    display:block; text-align:center; font-size:.72rem; color:#c7c0a9;
    border:1.5px dashed var(--line); border-radius:8px; padding:16px 4px; margin-top:2px;
    width:100%;
  }

  .itinerary-box{
    width:100%; min-height:120px; resize:vertical; border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-family:inherit; font-size:.85rem; background:#fffdf8; line-height:1.6;
  }
  .itinerary-box:focus{outline:none; border-color:var(--moss);}

  .hotel-card{
    background:#fffdf8; border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; margin-bottom:8px; cursor:grab; position:relative;
    transition:box-shadow .15s, border-color .15s;
  }
  .hotel-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .hotel-card.chosen{border-color:var(--moss); background:var(--chosen);}
  .hotel-card.chosen::before{
    content:"✅ 已選定"; font-size:.68rem; color:var(--moss-dk); font-weight:700;
    display:block; margin-bottom:3px;
  }
  .card-title{font-weight:700; font-size:.88rem; color:var(--ink); word-break:break-word;}
  .card-sub{font-size:.75rem; color:var(--muted); margin-top:2px;}
  .card-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px;}
  .tag{font-size:.68rem; background:#eef0e6; color:var(--moss-dk); border-radius:4px; padding:2px 6px;}
  .price-tag{font-size:.85rem; font-weight:800; color:var(--clay); margin-top:6px;}
  .price-tag .orig{font-size:.68rem; color:var(--muted); font-weight:500; display:block; margin-top:1px;}
  .card-actions{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .card-actions button{
    font-size:.68rem; border:none; background:#eee; border-radius:5px; padding:3px 7px; cursor:pointer;
  }
  .card-actions .pick-btn{background:var(--moss); color:#fff;}
  .card-actions .del-btn{background:#f3e2dd; color:var(--clay);}
  .card-actions a{font-size:.68rem; color:#2f6fb0; align-self:center;}
  .pc-time{font-size:.68rem; color:var(--moss-dk); font-weight:700;}
  .map-quick{
    position:absolute; top:7px; right:8px; text-decoration:none; font-size:.95rem;
    background:#eef3f8; border-radius:6px; padding:2px 6px; line-height:1.4;
  }
  .card-hint{font-size:.64rem; color:#c7c0a9; text-align:right; margin-top:5px;}
  .detail-row{font-size:.85rem; margin-bottom:9px; line-height:1.5;}
  .detail-row b{color:var(--moss-dk);}
  .detail-row .orig{font-size:.72rem; color:var(--muted);}
  .detail-links{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .btn-outline-dark{
    display:inline-block; border:1px solid var(--moss); color:var(--moss-dk); background:#fff;
    border-radius:6px; padding:7px 12px; font-size:.8rem; font-weight:600; text-decoration:none;
  }
  #detailDialog{width:min(460px,92vw);}

  .sortable-ghost{opacity:.35;}
  .sortable-drag{cursor:grabbing;}

  dialog{
    border:none; border-radius:12px; padding:0; width:min(440px,92vw);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  dialog::backdrop{background:rgba(20,20,15,.45);}
  .modal-inner{padding:20px 22px;}
  .modal-inner h3{margin:0 0 14px; color:var(--moss-dk);}
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:.75rem; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=url], .field textarea, .field select{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:.85rem;
    font-family:inherit; background:#fdfcf8;
  }
  .field textarea{resize:vertical; min-height:44px;}
  .row2{display:flex; gap:10px;}
  .row2 > .field{flex:1;}
  .checks{display:flex; gap:16px; align-items:center; margin-top:4px;}
  .checks label{display:flex; align-items:center; gap:5px; font-size:.8rem; color:var(--ink); font-weight:500;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .modal-actions button{padding:8px 16px; border-radius:6px; border:none; font-weight:600; cursor:pointer; font-size:.85rem;}
  .cancel-btn{background:#eee; color:#555;}
  .save-btn{background:var(--moss); color:#fff;}

  #config-banner{
    margin:14px 18px 0; background:#fff4e6; border:1px solid #e6c78a; border-radius:8px;
    padding:10px 14px; font-size:.8rem; color:#7a5417; display:none;
  }
  #config-banner code{background:#fff; padding:1px 5px; border-radius:4px;}

  @media (max-width:900px){
    #layout{flex-direction:column;}
    #pool-panel{flex:1 1 auto; width:100%; position:static; max-height:none;}
    #board{width:100%;}
  }
  @media (max-width:640px){
    .day-col{flex-direction:column;}
    .day-side{flex-direction:row; justify-content:center; gap:8px; border-right:none; border-bottom:2px solid var(--moss);}
    .day-body{flex-direction:column;}
    .day-section{border-right:none; border-bottom:1px solid var(--line);}
    .day-section:last-child{border-bottom:none;}
    header h1{font-size:1rem;}
  }
</style>
</head>
<body>

<header>
  <h1>🗺️ 旅程訂房看板 <small>2027/1/23 – 1/31</small></h1>
  <div class="header-right">
    <span style="font-size:.78rem;"><span class="status-dot" id="statusDot"></span><span id="statusText">連線中…</span></span>
    <div class="guests-box">
      <span>總人數</span>
      <input id="guestsInput" type="number" min="1" value="8">
      <span>人</span>
    </div>
    <div class="guests-box">
      <span>匯率 1日圓=</span>
      <input id="rateInput" type="number" min="0" step="0.0001" value="0.219">
      <span>台幣</span>
    </div>
    <div class="total-box">
      已選 <b id="chosen-count">0</b>/9 天　住宿總額 NT$<b id="total-price">0</b>
    </div>
    <button class="btn btn-gold" id="exportBtn">📋 複製總覽</button>
  </div>
</header>

<div id="config-banner">
  ⚠️ 尚未設定 Firebase,資料不會同步保存。請打開 <code>index.html</code>,把 <code>firebaseConfig</code> 換成你自己 Firebase 專案的設定值。
</div>

<div id="layout">
  <div id="board"></div>

  <div id="pool-panel">
    <div class="day-head">
      <div>
        <div class="d1">🏨 飯店資料庫</div>
        <div class="d2">新增後拖到左邊日期</div>
      </div>
      <button class="add-mini" id="addHotelPool">＋ 新增飯店</button>
    </div>
    <div class="col-section">
      <div style="margin-bottom:8px;">
        <select id="regionFilter" style="width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:.8rem; background:#fdfcf8;">
          <option value="">全部地區</option>
        </select>
      </div>
      <div class="drop-zone" id="poolZone" data-date=""></div>
    </div>
  </div>
</div>

<!-- 飯店編輯視窗 -->
<dialog id="hotelDialog">
  <form class="modal-inner" method="dialog" id="hotelForm">
    <h3 id="hotelDialogTitle">新增飯店候選</h3>
    <input type="hidden" id="h_id">
    <input type="hidden" id="h_targetDate">
    <div class="field">
      <label>飯店名稱</label>
      <input type="text" id="h_name" required placeholder="例如：花蓮理想大地">
    </div>
    <div class="field">
      <label>地址（可直接貼 Google 地圖上複製的地址）</label>
      <input type="text" id="h_address" placeholder="例如：33 Toyakoonsen, Toyako, Abuta District, Hokkaido">
    </div>
    <div class="field">
      <label>地區（會依地址自動判斷，也可手動修改）</label>
      <select id="h_region">
        <option value="">— 選擇地區 —</option>
        <option value="札幌">札幌</option>
        <option value="小樽">小樽</option>
        <option value="函館">函館</option>
        <option value="登別">登別</option>
        <option value="洞爺湖">洞爺湖</option>
        <option value="二世谷/新雪谷">二世谷/新雪谷</option>
        <option value="旭川">旭川</option>
        <option value="富良野/美瑛">富良野/美瑛</option>
        <option value="層雲峽">層雲峽</option>
        <option value="知床">知床</option>
        <option value="網走">網走</option>
        <option value="釧路">釧路</option>
        <option value="帶廣">帶廣</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="field">
      <label>Google 地圖連結</label>
      <input type="url" id="h_mapLink" placeholder="https://maps.app.goo.gl/...">
    </div>
    <div class="row2">
      <div class="field">
        <label>入住日期</label>
        <select id="h_checkIn"></select>
      </div>
      <div class="field">
        <label>退房日期</label>
        <select id="h_checkOut"></select>
      </div>
    </div>
    <div class="field">
      <label>此價格是幾人份？</label>
      <input type="number" id="h_capacity" min="1" placeholder="例如：2" required>
    </div>
    <div class="field">
      <label>每晚金額（每天可能不同，會自動加總）</label>
      <div id="nightlyPricesContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
      <div style="text-align:right; font-size:.8rem; color:var(--clay); font-weight:700; margin-top:6px;">
        總計：<span id="nightlyTotalLabel">0</span>
      </div>
    </div>
    <div class="field">
      <label>幣別</label>
      <select id="h_currency">
        <option value="TWD">新台幣 NT$</option>
        <option value="JPY">日圓 ¥</option>
      </select>
    </div>
    <div class="field checks">
      <label><input type="checkbox" id="h_breakfast"> 含早餐</label>
      <label><input type="checkbox" id="h_dinner"> 含晚餐</label>
    </div>
    <div class="field">
      <label>飯店介紹／官網連結</label>
      <input type="url" id="h_link" placeholder="https://...">
    </div>
    <div class="field">
      <label>訂房連結（agoda / booking 等）</label>
      <input type="url" id="h_bookingLink" placeholder="https://...">
    </div>
    <div class="row2">
      <div class="field">
        <label>👍 優點</label>
        <textarea id="h_pros" placeholder="例如：近車站、有停車場"></textarea>
      </div>
      <div class="field">
        <label>👎 缺點</label>
        <textarea id="h_cons" placeholder="例如：房間偏小"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="cancel-btn" id="hotelCancel">取消</button>
      <button type="submit" class="save-btn">儲存</button>
    </div>
  </form>
</dialog>

<!-- 行程編輯視窗 -->

<!-- 飯店詳情（唯讀）視窗 -->
<dialog id="detailDialog">
  <div class="modal-inner">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
      <h3 id="detailTitle" style="margin:0;">飯店詳情</h3>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button type="button" class="btn btn-gold" id="detailEditBtn">✏️ 編輯</button>
        <button type="button" class="btn" style="background:#eee; color:#555;" id="detailCloseBtn">關閉</button>
      </div>
    </div>
    <div id="detailBody" style="margin-top:14px;"></div>
  </div>
</dialog>

<script>
/* ============ 1. Firebase 設定 ============ */
const firebaseConfig = {
  apiKey: "AIzaSyA50pTthgi-13w36Dcjte6ChUcGcKJlqF0",
  authDomain: "trip-hotel-planner.firebaseapp.com",
  projectId: "trip-hotel-planner",
  storageBucket: "trip-hotel-planner.firebasestorage.app",
  messagingSenderId: "331719613724",
  appId: "1:331719613724:web:d46512cf2df71ef4fe2ed9",
  measurementId: "G-Y3XTRFYR6P"
};

const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
if (isConfigured) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} else {
  document.getElementById('config-banner').style.display = 'block';
  document.getElementById('statusText').textContent = '未連接資料庫（本機模式）';
  document.getElementById('statusDot').style.background = '#c98a4b';
}

/* ============ 2. 日期範圍 ============ */
const DATES = ["1/23","1/24","1/25","1/26","1/27","1/28","1/29","1/30","1/31"];
const WEEK = ["六","日","一","二","三","四","五","六","日"]; // 對應 2027/1/23(民國116年)為週六起算
const REGIONS = ["札幌","小樽","函館","登別","洞爺湖","二世谷/新雪谷","旭川","富良野/美瑛","層雲峽","知床","網走","釧路","帶廣","其他"];
let regionFilterValue = "";
let hotels = [];      // 扁平陣列: {id,name,capacity,price,breakfast,dinner,link,bookingLink,pros,cons,chosen,assignedDate:null|"1/23"}
let itinerary = {};    // { "1/23": "文字內容", ... } 每天一段共用純文字
let totalGuests = 8;
let jpyRate = 0.219; // 1 日圓 = 多少台幣

/* ============ 3. 本機儲存 fallback ============ */
const LOCAL_KEY = 'trip_planner_local_v2';
function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw){ const d = JSON.parse(raw); hotels = d.hotels || []; itinerary = d.itinerary || {}; totalGuests = d.totalGuests || 8; jpyRate = d.jpyRate || 0.219; }
  }catch(e){}
}
function saveLocal(){ localStorage.setItem(LOCAL_KEY, JSON.stringify({hotels, itinerary, totalGuests, jpyRate})); }

/* ============ 4. Firestore 讀寫 ============ */
function watchFirestore(){
  db.collection('trip_data').doc('hotelsFlat').onSnapshot(snap=>{
    if(snap.exists){ hotels = snap.data().list || []; }
    render();
  }, err=>{
    console.error('讀取 hotelsFlat 失敗', err);
    document.getElementById('statusText').textContent = '同步失敗（請檢查 Firestore 規則）';
    document.getElementById('statusDot').style.background = '#c0392b';
  });
  db.collection('trip_data').doc('itineraryText').onSnapshot(snap=>{
    if(snap.exists){ itinerary = snap.data().byDate || {}; }
    renderItineraryTextOnly();
  }, err=>{ console.error('讀取 itineraryText 失敗', err); });
  db.collection('trip_data').doc('settings').onSnapshot(snap=>{
    if(snap.exists && snap.data().totalGuests){ totalGuests = snap.data().totalGuests; }
    if(snap.exists && snap.data().jpyRate){ jpyRate = snap.data().jpyRate; }
    render();
  }, err=>{ console.error('讀取 settings 失敗', err); });
  document.getElementById('statusText').textContent = '即時同步中';
}
function persist(){
  if(isConfigured && db){
    db.collection('trip_data').doc('hotelsFlat').set({list: hotels});
    db.collection('trip_data').doc('settings').set({totalGuests, jpyRate}, {merge:true});
  } else {
    saveLocal();
  }
  render();
}

let itineraryDebounce = null;
function persistItinerary(date, text){
  itinerary[date] = text;
  if(itineraryDebounce) clearTimeout(itineraryDebounce);
  itineraryDebounce = setTimeout(() => {
    if(isConfigured && db){
      db.collection('trip_data').doc('itineraryText').set({byDate: itinerary});
    } else {
      saveLocal();
    }
  }, 500);
}
function renderItineraryTextOnly(){
  document.querySelectorAll('.itinerary-box').forEach(ta => {
    const d = ta.dataset.date;
    // 只有在使用者目前沒有focus在這個欄位時才更新內容，避免打斷輸入
    if(document.activeElement !== ta && itinerary[d] !== undefined && ta.value !== itinerary[d]){
      ta.value = itinerary[d] || '';
    }
  });
}

/* ============ 5. Render ============ */
const board = document.getElementById('board');
const poolZone = document.getElementById('poolZone');
const regionFilterEl = document.getElementById('regionFilter');
REGIONS.forEach(r => {
  const opt = document.createElement('option');
  opt.value = r; opt.textContent = r;
  regionFilterEl.appendChild(opt);
});
regionFilterEl.addEventListener('change', () => { regionFilterValue = regionFilterEl.value; render(); });

function priceInTWD(h){
  const price = Number(h.price)||0;
  if(h.currency === 'JPY') return price * jpyRate;
  return price;
}
function adjustedPrice(h){
  const cap = Number(h.capacity)||0;
  const twd = priceInTWD(h);
  if(!cap) return Math.round(twd);
  return Math.round(twd / cap * totalGuests);
}

function render(){
  document.getElementById('guestsInput').value = totalGuests;
  document.getElementById('rateInput').value = jpyRate;

  board.innerHTML = '';
  DATES.forEach((d, idx) => {
    const col = document.createElement('div');
    col.className = 'day-col';
    col.innerHTML = `
      <div class="day-side">
        <div class="d1">${d}<br><span style="color:var(--clay); font-size:.82rem;">（週${WEEK[idx]}）</span></div>
        <div class="d2">Day ${idx+1}</div>
      </div>
      <div class="day-body">
        <div class="day-section">
          <h3>🏨 飯店候選 <button class="add-mini" data-add-hotel="${d}">＋新增飯店</button></h3>
          <div class="drop-zone hotel-drop" data-date="${d}"></div>
        </div>
        <div class="day-section">
          <h3>📍 當天行程</h3>
          <textarea class="itinerary-box" data-date="${d}" placeholder="直接輸入這天的行程、地點、交通方式...任何人都可以編輯">${escapeHtml(itinerary[d]||'')}</textarea>
        </div>
      </div>
    `;
    board.appendChild(col);

    const hzone = col.querySelector('.hotel-drop');
    const list = hotels.filter(h => h.assignedDate === d);
    if(list.length===0) hzone.classList.add('empty-hint');
    list.forEach(h => hzone.appendChild(renderHotelCard(h)));
    new Sortable(hzone, { group:'hotelsShared', animation:150, onAdd:onDrop, onRemove:onDrop, onEnd:onDrop });

    const itineraryBox = col.querySelector('.itinerary-box');
    itineraryBox.addEventListener('input', () => persistItinerary(d, itineraryBox.value));

    col.querySelector('[data-add-hotel]').onclick = () => openHotelDialog(null, d);
  });

  poolZone.innerHTML = '';
  let poolList = hotels.filter(h => !h.assignedDate);
  if(regionFilterValue) poolList = poolList.filter(h => h.region === regionFilterValue);
  if(poolList.length===0) poolZone.classList.add('empty-hint'); else poolZone.classList.remove('empty-hint');
  poolList.forEach(h => poolZone.appendChild(renderHotelCard(h)));
  new Sortable(poolZone, { group:'hotelsShared', animation:150, onAdd:onDrop, onRemove:onDrop, onEnd:onDrop });

  updateHeaderTotal();
}

function onDrop(){
  // 依照每個 zone 目前的卡片順序與所屬 data-date 更新 assignedDate
  const zones = document.querySelectorAll('.hotel-drop, #poolZone');
  const newHotels = [...hotels];
  zones.forEach(zone => {
    const date = zone.dataset.date || null;
    [...zone.children].forEach(card => {
      const h = newHotels.find(x => x.id === card.dataset.id);
      if(h) h.assignedDate = date;
    });
  });
  hotels = newHotels;
  persist();
}

function renderHotelCard(h){
  const el = document.createElement('div');
  el.className = 'hotel-card' + (h.chosen ? ' chosen' : '');
  el.dataset.id = h.id;
  const metaBits = [];
  if(h.capacity) metaBits.push(`<span class="tag">👥 原價 ${h.capacity}人份</span>`);
  if(h.breakfast) metaBits.push(`<span class="tag">🍳 含早餐</span>`);
  if(h.dinner) metaBits.push(`<span class="tag">🍽️ 含晚餐</span>`);
  const adj = adjustedPrice(h);
  const nights = h.checkIn && h.checkOut ? nightsBetween(h.checkIn, h.checkOut) : [];
  el.innerHTML = `
    ${h.mapLink ? `<a class="map-quick" href="${escapeAttr(h.mapLink)}" target="_blank" rel="noopener" title="在 Google 地圖開啟">🗺️</a>` : ''}
    <div class="card-title">${escapeHtml(h.name)}</div>
    ${nights.length>0 ? `<div class="card-meta"><span class="tag" style="background:#fbeedc; color:#8a5a1e;">🛏️ ${h.checkIn}→${h.checkOut}（住${nights.length}晚）</span></div>` : ''}
    ${h.region ? `<div class="card-meta"><span class="tag" style="background:#e3ecf5; color:#2b4d73;">📍 ${escapeHtml(h.region)}</span></div>` : ''}
    <div class="card-meta">${metaBits.join('')}</div>
    ${h.price ? `<div class="price-tag">NT$${adj.toLocaleString()}（${totalGuests}人）
        <span class="orig">原價 ${h.currency==='JPY'?'¥':'NT$'}${Number(h.price).toLocaleString()} / ${h.capacity||'?'}人${h.currency==='JPY' ? `（約合 NT$${Math.round(priceInTWD(h)).toLocaleString()}）` : ''}</span>
      </div>` : ''}
    <div class="card-actions">
      ${h.assignedDate ? `<button class="pick-btn" data-pick="${h.id}">${h.chosen ? '取消選定' : '選這間'}</button>` : ''}
      <button class="del-btn" data-del-hotel="${h.id}">刪除</button>
    </div>
    <div class="card-hint">雙擊查看詳情</div>
  `;
  el.querySelector('[data-del-hotel]').onclick = (e) => { e.stopPropagation(); if(confirm(`確定刪除「${h.name}」嗎？`)) deleteHotel(h.id); };
  const pickBtn = el.querySelector('[data-pick]');
  if(pickBtn) pickBtn.onclick = (e) => { e.stopPropagation(); toggleChosen(h.id); };
  const mapQuick = el.querySelector('.map-quick');
  if(mapQuick) mapQuick.onclick = (e) => e.stopPropagation();
  el.addEventListener('dblclick', () => openHotelDetail(h));
  return el;
}

function openHotelDetail(h){
  const adj = adjustedPrice(h);
  const nights = h.checkIn && h.checkOut ? nightsBetween(h.checkIn, h.checkOut) : [];
  const currencySym = h.currency==='JPY' ? '¥' : 'NT$';
  const nightlyRows = nights.map(d => `
    <div style="display:flex; justify-content:space-between; font-size:.8rem; padding:3px 0; border-bottom:1px dashed var(--line);">
      <span>${d} 晚</span><span>${currencySym}${Number((h.nightlyPrices||{})[d]||0).toLocaleString()}</span>
    </div>
  `).join('');
  document.getElementById('detailTitle').textContent = h.name;
  document.getElementById('detailBody').innerHTML = `
    ${nights.length>0 ? `<div class="card-meta"><span class="tag" style="background:#fbeedc; color:#8a5a1e;">🛏️ ${h.checkIn}→${h.checkOut}（住${nights.length}晚）</span></div>` : ''}
    ${h.region ? `<div class="card-meta"><span class="tag" style="background:#e3ecf5; color:#2b4d73;">📍 ${escapeHtml(h.region)}</span></div>` : ''}
    ${h.address ? `<div class="detail-row"><b>地址：</b>${escapeHtml(h.address)}</div>` : ''}
    ${h.capacity ? `<div class="detail-row"><b>人數：</b>${escapeHtml(String(h.capacity))} 人份報價</div>` : ''}
    ${nightlyRows ? `<div class="detail-row"><b>每晚金額：</b>${nightlyRows}</div>` : ''}
    ${h.price ? `<div class="detail-row"><b>總金額：</b>NT$${adj.toLocaleString()}（換算 ${totalGuests} 人）<br><span class="orig">原價 ${currencySym}${Number(h.price).toLocaleString()} / ${h.capacity||'?'}人</span></div>` : ''}
    <div class="detail-row">${h.breakfast ? '<span class="tag">🍳 含早餐</span>' : ''} ${h.dinner ? '<span class="tag">🍽️ 含晚餐</span>' : ''}</div>
    ${h.pros ? `<div class="detail-row"><b>👍 優點：</b>${escapeHtml(h.pros)}</div>` : ''}
    ${h.cons ? `<div class="detail-row"><b>👎 缺點：</b>${escapeHtml(h.cons)}</div>` : ''}
    <div class="detail-links">
      ${h.link ? `<a href="${escapeAttr(h.link)}" target="_blank" rel="noopener" class="btn btn-outline-dark">🔗 飯店介紹</a>` : ''}
      ${h.bookingLink ? `<a href="${escapeAttr(h.bookingLink)}" target="_blank" rel="noopener" class="btn btn-outline-dark">🛏️ 訂房連結</a>` : ''}
      ${h.mapLink ? `<a href="${escapeAttr(h.mapLink)}" target="_blank" rel="noopener" class="btn btn-outline-dark">🗺️ Google 地圖</a>` : ''}
    </div>
  `;
  document.getElementById('detailEditBtn').onclick = () => { detailDialog.close(); openHotelDialog(h); };
  detailDialog.showModal();
}

function updateHeaderTotal(){
  let count = 0, total = 0;
  DATES.forEach(d => {
    const chosen = hotels.find(h => h.assignedDate === d && h.chosen);
    if(chosen){ count++; total += adjustedPrice(chosen); }
  });
  document.getElementById('chosen-count').textContent = count;
  document.getElementById('total-price').textContent = total.toLocaleString();
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ============ 6. CRUD ============ */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function upsertHotel(data){
  const idx = hotels.findIndex(h => h.id === data.id);
  if(idx >= 0) hotels[idx] = {...hotels[idx], ...data}; else hotels.push(data);
  persist();
}
function deleteHotel(id){
  hotels = hotels.filter(h => h.id !== id);
  persist();
}
function toggleChosen(id){
  hotels.forEach(h => { if(h.id === id) h.chosen = !h.chosen; });
  persist();
}

/* ============ 7. 對話框 ============ */
const hotelDialog = document.getElementById('hotelDialog');
const hotelForm = document.getElementById('hotelForm');
const detailDialog = document.getElementById('detailDialog');
document.getElementById('detailCloseBtn').onclick = () => detailDialog.close();
document.getElementById('hotelCancel').onclick = () => hotelDialog.close();
document.getElementById('addHotelPool').onclick = () => openHotelDialog(null, null);

function nightsBetween(checkIn, checkOut){
  const i1 = DATES.indexOf(checkIn), i2 = DATES.indexOf(checkOut);
  if(i1<0 || i2<0 || i2<=i1) return [];
  return DATES.slice(i1, i2);
}
function currentNightlyValues(){
  const vals = {};
  document.querySelectorAll('.nightly-input').forEach(inp => { vals[inp.dataset.date] = inp.value; });
  return vals;
}
function updateNightlyTotal(){
  let total = 0;
  document.querySelectorAll('.nightly-input').forEach(inp => total += Number(inp.value)||0);
  document.getElementById('nightlyTotalLabel').textContent = total.toLocaleString();
}
function renderNightlyInputs(existingPrices){
  const checkIn = document.getElementById('h_checkIn').value;
  const checkOut = document.getElementById('h_checkOut').value;
  const nights = nightsBetween(checkIn, checkOut);
  const container = document.getElementById('nightlyPricesContainer');
  if(nights.length === 0){
    container.innerHTML = '<div style="font-size:.78rem;color:var(--muted);">退房日期需晚於入住日期</div>';
    updateNightlyTotal();
    return;
  }
  container.innerHTML = nights.map(d => `
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="width:66px; font-size:.78rem; color:var(--muted); flex-shrink:0;">${d} 晚</span>
      <input type="number" min="0" class="nightly-input" data-date="${d}" value="${existingPrices && existingPrices[d] !== undefined ? existingPrices[d] : ''}" placeholder="金額" style="flex:1; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:.82rem;">
    </div>
  `).join('');
  container.querySelectorAll('.nightly-input').forEach(inp => inp.addEventListener('input', updateNightlyTotal));
  updateNightlyTotal();
}
const h_checkInEl = document.getElementById('h_checkIn');
const h_checkOutEl = document.getElementById('h_checkOut');
[h_checkInEl, h_checkOutEl].forEach(sel => {
  DATES.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=d; sel.appendChild(o); });
});
h_checkInEl.addEventListener('change', () => renderNightlyInputs(currentNightlyValues()));
h_checkOutEl.addEventListener('change', () => renderNightlyInputs(currentNightlyValues()));

function openHotelDialog(h, targetDate){
  document.getElementById('hotelDialogTitle').textContent = h ? '編輯飯店' : '新增飯店';
  document.getElementById('h_id').value = h ? h.id : uid();
  document.getElementById('h_targetDate').value = h ? (h.assignedDate||'') : (targetDate||'');
  document.getElementById('h_name').value = h ? h.name : '';
  document.getElementById('h_address').value = h ? (h.address||'') : '';
  document.getElementById('h_region').value = h ? (h.region||'') : '';
  document.getElementById('h_mapLink').value = h ? (h.mapLink||'') : '';
  document.getElementById('h_capacity').value = h ? (h.capacity||'') : '';
  document.getElementById('h_currency').value = h ? (h.currency||'TWD') : 'TWD';
  document.getElementById('h_breakfast').checked = h ? !!h.breakfast : false;
  document.getElementById('h_dinner').checked = h ? !!h.dinner : false;
  document.getElementById('h_link').value = h ? (h.link||'') : '';
  document.getElementById('h_bookingLink').value = h ? (h.bookingLink||'') : '';
  document.getElementById('h_pros').value = h ? (h.pros||'') : '';
  document.getElementById('h_cons').value = h ? (h.cons||'') : '';

  const defaultCheckIn = h ? (h.checkIn || targetDate || DATES[0]) : (targetDate || DATES[0]);
  const inIdx = DATES.indexOf(defaultCheckIn);
  const defaultCheckOut = h ? (h.checkOut || DATES[Math.min(inIdx+1, DATES.length-1)]) : DATES[Math.min(inIdx+1, DATES.length-1)];
  h_checkInEl.value = defaultCheckIn;
  h_checkOutEl.value = defaultCheckOut;
  renderNightlyInputs(h ? (h.nightlyPrices||{}) : {});

  hotelDialog.showModal();
}

// 依地址關鍵字自動猜測北海道地區（英文/日文/中文都比對）
const REGION_KEYWORDS = {
  "札幌": ["sapporo","札幌"],
  "小樽": ["otaru","小樽"],
  "函館": ["hakodate","函館"],
  "登別": ["noboribetsu","登別"],
  "洞爺湖": ["toyako","toya lake","toya-ko","洞爺"],
  "二世谷/新雪谷": ["niseko","二世谷","新雪谷"],
  "旭川": ["asahikawa","旭川"],
  "富良野/美瑛": ["furano","biei","富良野","美瑛"],
  "層雲峽": ["sounkyo","層雲峽"],
  "知床": ["shiretoko","知床"],
  "網走": ["abashiri","網走"],
  "釧路": ["kushiro","釧路"],
  "帶廣": ["obihiro","帶廣"]
};
function guessRegion(address){
  const a = (address||"").toLowerCase();
  for(const [region, keys] of Object.entries(REGION_KEYWORDS)){
    if(keys.some(k => a.includes(k.toLowerCase()))) return region;
  }
  return "";
}
document.getElementById('h_address').addEventListener('input', () => {
  const guessed = guessRegion(document.getElementById('h_address').value);
  if(guessed) document.getElementById('h_region').value = guessed;
});

hotelForm.addEventListener('submit', () => {
  const id = document.getElementById('h_id').value;
  const existing = hotels.find(x => x.id === id);
  const targetDate = document.getElementById('h_targetDate').value || null;
  const checkIn = h_checkInEl.value;
  const checkOut = h_checkOutEl.value;
  const nightlyPrices = {};
  let priceSum = 0;
  document.querySelectorAll('.nightly-input').forEach(inp => {
    const v = Number(inp.value)||0;
    nightlyPrices[inp.dataset.date] = v;
    priceSum += v;
  });
  const data = {
    id,
    assignedDate: existing ? existing.assignedDate : (targetDate || checkIn),
    chosen: existing ? existing.chosen : false,
    name: document.getElementById('h_name').value.trim(),
    address: document.getElementById('h_address').value.trim(),
    region: document.getElementById('h_region').value,
    mapLink: document.getElementById('h_mapLink').value.trim(),
    checkIn,
    checkOut,
    nightlyPrices,
    capacity: document.getElementById('h_capacity').value,
    price: priceSum,
    currency: document.getElementById('h_currency').value,
    breakfast: document.getElementById('h_breakfast').checked,
    dinner: document.getElementById('h_dinner').checked,
    link: document.getElementById('h_link').value.trim(),
    bookingLink: document.getElementById('h_bookingLink').value.trim(),
    pros: document.getElementById('h_pros').value.trim(),
    cons: document.getElementById('h_cons').value.trim()
  };
  upsertHotel(data);
});

/* ============ 8. 總人數／匯率設定 ============ */
const guestsInput = document.getElementById('guestsInput');
guestsInput.addEventListener('change', () => {
  totalGuests = Math.max(1, parseInt(guestsInput.value)||8);
  persist();
});
const rateInput = document.getElementById('rateInput');
rateInput.addEventListener('change', () => {
  jpyRate = Math.max(0, parseFloat(rateInput.value)||0.219);
  persist();
});

/* ============ 9. 匯出 ============ */
document.getElementById('exportBtn').onclick = () => {
  let text = `📌 旅程住宿總覽 (1/23–1/31，${totalGuests}人)\n\n`;
  DATES.forEach((d, idx) => {
    const chosen = hotels.find(h => h.assignedDate === d && h.chosen);
    text += `${d}（週${WEEK[idx]}）：` + (chosen ? `${chosen.name}（NT$${adjustedPrice(chosen).toLocaleString()}）` : '尚未選定') + `\n`;
  });
  navigator.clipboard.writeText(text).then(()=> alert('已複製到剪貼簿！可以貼到 LINE 群組。'));
};

/* ============ 10. 啟動 ============ */
loadLocal();
render();
if(isConfigured && db){
  watchFirestore();
}
</script>
