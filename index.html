<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程訂房看板 · 1/23–1/31</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1f2a24;
    --paper:#f6f3ea;
    --line:#d9d2bd;
    --moss:#3f5c46;
    --moss-dk:#2b4232;
    --clay:#b5583a;
    --gold:#c39a3f;
    --card:#ffffff;
    --muted:#7a7466;
    --chosen:#e9f2e6;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:var(--moss-dk);
    color:#f3efe2;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{
    font-size:1.15rem; margin:0; font-weight:700; letter-spacing:.02em;
    display:flex; align-items:baseline; gap:8px;
  }
  header h1 small{font-weight:400; opacity:.75; font-size:.75rem;}
  .header-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .name-box{display:flex; align-items:center; gap:6px;}
  .name-box input{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
    color:#fff; padding:6px 10px; border-radius:6px; font-size:.85rem; width:110px;
  }
  .name-box input::placeholder{color:rgba(255,255,255,.6);}
  .btn{
    border:none; border-radius:6px; padding:7px 12px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn-clay{background:var(--clay); color:#fff;}
  .btn-gold{background:var(--gold); color:#2b2410;}
  .btn-outline{background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff;}
  .btn-ghost{background:transparent; color:var(--muted); text-decoration:underline; padding:4px 6px;}
  .status-dot{width:8px; height:8px; border-radius:50%; background:#8fbf8f; display:inline-block; margin-right:5px;}

  #summary{
    margin:16px 18px 0; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px;
  }
  #summary h2{margin:0 0 10px; font-size:.95rem; color:var(--moss-dk); letter-spacing:.03em;}
  #summary-grid{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .sum-item{
    flex:0 0 auto; min-width:118px; border-left:3px solid var(--gold);
    background:var(--chosen); border-radius:6px; padding:8px 10px; font-size:.78rem;
  }
  .sum-item.empty{border-left-color:var(--line); background:#faf9f4; color:var(--muted);}
  .sum-date{font-weight:700; color:var(--moss-dk); font-size:.8rem;}
  .sum-hotel{margin-top:3px; font-weight:600;}
  .sum-price{color:var(--clay); font-weight:700; margin-top:2px;}
  #total-price{font-weight:700; color:var(--clay);}

  #board{
    display:flex; gap:12px; overflow-x:auto; padding:16px 18px 40px;
    scroll-snap-type:x proximity;
  }
  .day-col{
    flex:0 0 260px; scroll-snap-align:start;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; max-height:calc(100vh - 230px);
  }
  .day-head{
    padding:10px 12px; border-bottom:2px solid var(--moss);
    background:linear-gradient(180deg,#fff,#faf8f0);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .day-head .d1{font-weight:800; color:var(--moss-dk); font-size:1rem;}
  .day-head .d2{font-size:.72rem; color:var(--muted);}
  .col-section{padding:8px 10px; overflow-y:auto; flex:1;}
  .col-section h3{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:6px 2px; display:flex; justify-content:space-between; align-items:center;
  }
  .add-mini{
    background:none; border:1px dashed var(--line); color:var(--moss);
    border-radius:6px; width:22px; height:22px; cursor:pointer; font-size:.9rem; line-height:1;
  }
  .drop-zone{min-height:12px;}

  .hotel-card, .plan-card{
    background:#fffdf8; border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; margin-bottom:8px; cursor:grab; position:relative;
    transition:box-shadow .15s, border-color .15s;
  }
  .hotel-card:hover, .plan-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .hotel-card.chosen{border-color:var(--moss); background:var(--chosen);}
  .hotel-card.chosen::before{
    content:"✅ 已選定"; font-size:.68rem; color:var(--moss-dk); font-weight:700;
    display:block; margin-bottom:3px;
  }
  .span-badge{
    display:inline-block; font-size:.65rem; background:var(--gold); color:#2b2410;
    border-radius:10px; padding:1px 7px; margin-left:5px; font-weight:700;
  }
  .card-title{font-weight:700; font-size:.88rem; color:var(--ink); word-break:break-word;}
  .card-sub{font-size:.75rem; color:var(--muted); margin-top:2px;}
  .card-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px;}
  .tag{font-size:.68rem; background:#eef0e6; color:var(--moss-dk); border-radius:4px; padding:2px 6px;}
  .price-tag{font-size:.8rem; font-weight:800; color:var(--clay); margin-top:5px;}
  .card-actions{display:flex; gap:6px; margin-top:7px;}
  .card-actions button{
    font-size:.68rem; border:none; background:#eee; border-radius:5px; padding:3px 7px; cursor:pointer;
  }
  .card-actions .pick-btn{background:var(--moss); color:#fff;}
  .card-actions .del-btn{background:#f3e2dd; color:var(--clay);}
  .card-actions a{font-size:.68rem; color:#2f6fb0; align-self:center;}
  .meta-edit{font-size:.68rem; color:#bcb49a; margin-top:6px; text-align:right;}
  .pc-time{font-size:.68rem; color:var(--moss-dk); font-weight:700;}

  .sortable-ghost{opacity:.35;}
  .sortable-drag{cursor:grabbing;}

  dialog{
    border:none; border-radius:12px; padding:0; width:min(440px,92vw);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  dialog::backdrop{background:rgba(20,20,15,.45);}
  .modal-inner{padding:20px 22px;}
  .modal-inner h3{margin:0 0 14px; color:var(--moss-dk);}
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:.75rem; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=url], .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:.85rem;
    font-family:inherit; background:#fdfcf8;
  }
  .field textarea{resize:vertical; min-height:44px;}
  .row2{display:flex; gap:10px;}
  .row2 > .field{flex:1;}
  .checks{display:flex; gap:16px; align-items:center; margin-top:4px;}
  .checks label{display:flex; align-items:center; gap:5px; font-size:.8rem; color:var(--ink); font-weight:500;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .modal-actions button{padding:8px 16px; border-radius:6px; border:none; font-weight:600; cursor:pointer; font-size:.85rem;}
  .cancel-btn{background:#eee; color:#555;}
  .save-btn{background:var(--moss); color:#fff;}

  #config-banner{
    margin:14px 18px 0; background:#fff4e6; border:1px solid #e6c78a; border-radius:8px;
    padding:10px 14px; font-size:.8rem; color:#7a5417; display:none;
  }
  #config-banner code{background:#fff; padding:1px 5px; border-radius:4px;}

  @media (max-width:600px){
    .day-col{flex:0 0 82vw;}
    header h1{font-size:1rem;}
  }
</style>
</head>
<body>

<header>
  <h1>🗺️ 旅程訂房看板 <small>1/23 – 1/31</small></h1>
  <div class="header-right">
    <span style="font-size:.78rem;"><span class="status-dot" id="statusDot"></span><span id="statusText">連線中…</span></span>
    <div class="name-box">
      <span style="font-size:.8rem;">我是</span>
      <input id="userNameInput" type="text" placeholder="輸入暱稱" maxlength="10">
    </div>
    <button class="btn btn-gold" id="exportBtn">📋 複製總覽</button>
  </div>
</header>

<div id="config-banner">
  ⚠️ 尚未設定 Firebase,資料不會同步保存。請打開 <code>index.html</code>,把 <code>firebaseConfig</code> 換成你自己 Firebase 專案的設定值。
</div>

<div id="summary">
  <h2>✅ 目前住宿總覽（已選定的飯店）</h2>
  <div id="summary-grid"></div>
  <div style="margin-top:8px; font-size:.8rem;">已選天數：<span id="chosen-count">0</span> / 9　總價（已選）：$<span id="total-price">0</span></div>
</div>

<div id="board"></div>

<!-- 飯店編輯視窗 -->
<dialog id="hotelDialog">
  <form class="modal-inner" method="dialog" id="hotelForm">
    <h3 id="hotelDialogTitle">新增飯店候選</h3>
    <input type="hidden" id="h_id">
    <input type="hidden" id="h_startDate">
    <div class="field">
      <label>飯店名稱</label>
      <input type="text" id="h_name" required placeholder="例如：花蓮理想大地">
    </div>
    <div class="row2">
      <div class="field">
        <label>連續入住天數</label>
        <input type="number" id="h_nights" min="1" max="9" value="1">
      </div>
      <div class="field">
        <label>可住人數</label>
        <input type="number" id="h_capacity" min="1" placeholder="例如：4">
      </div>
    </div>
    <div class="field">
      <label>總價（整段住宿）</label>
      <input type="number" id="h_price" min="0" placeholder="新台幣">
    </div>
    <div class="field checks">
      <label><input type="checkbox" id="h_breakfast"> 含早餐</label>
      <label><input type="checkbox" id="h_dinner"> 含晚餐</label>
    </div>
    <div class="field">
      <label>飯店介紹／官網連結</label>
      <input type="url" id="h_link" placeholder="https://...">
    </div>
    <div class="field">
      <label>訂房連結（agoda / booking 等）</label>
      <input type="url" id="h_bookingLink" placeholder="https://...">
    </div>
    <div class="row2">
      <div class="field">
        <label>👍 優點</label>
        <textarea id="h_pros" placeholder="例如：近車站、有停車場"></textarea>
      </div>
      <div class="field">
        <label>👎 缺點</label>
        <textarea id="h_cons" placeholder="例如：房間偏小"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="cancel-btn" id="hotelCancel">取消</button>
      <button type="submit" class="save-btn">儲存</button>
    </div>
  </form>
</dialog>

<!-- 行程編輯視窗 -->
<dialog id="planDialog">
  <form class="modal-inner" method="dialog" id="planForm">
    <h3>新增當天行程</h3>
    <input type="hidden" id="p_id">
    <input type="hidden" id="p_date">
    <div class="field">
      <label>時間（選填）</label>
      <input type="text" id="p_time" placeholder="例如：09:00 或 上午">
    </div>
    <div class="field">
      <label>地點／活動</label>
      <input type="text" id="p_title" required placeholder="例如：太魯閣 燕子口步道">
    </div>
    <div class="field">
      <label>備註</label>
      <textarea id="p_note" placeholder="交通方式、注意事項等"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="cancel-btn" id="planCancel">取消</button>
      <button type="submit" class="save-btn">儲存</button>
    </div>
  </form>
</dialog>

<script>
/* ============ 1. Firebase 設定 ============
   請到 https://console.firebase.google.com 建立專案 →
   建立 Firestore Database（測試模式即可）→
   專案設定 → 新增網頁應用程式 → 複製 config 貼在下面。
================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyA50pTthgi-13w36Dcjte6ChUcGcKJlqF0",
  authDomain: "trip-hotel-planner.firebaseapp.com",
  projectId: "trip-hotel-planner",
  storageBucket: "trip-hotel-planner.firebasestorage.app",
  messagingSenderId: "331719613724",
  appId: "1:331719613724:web:d46512cf2df71ef4fe2ed9",
  measurementId: "G-Y3XTRFYR6P"
};

const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
if (isConfigured) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} else {
  document.getElementById('config-banner').style.display = 'block';
  document.getElementById('statusText').textContent = '未連接資料庫（本機模式）';
  document.getElementById('statusDot').style.background = '#c98a4b';
}

/* ============ 2. 日期範圍 ============ */
const DATES = ["1/23","1/24","1/25","1/26","1/27","1/28","1/29","1/30","1/31"];
const WEEK = ["五","六","日","一","二","三","四","五","六"]; // 對應 2026/1/23 為週五起算，僅供參考顯示，不影響功能
let hotels = {};   // { "1/23": [ {id,name,nights,capacity,price,breakfast,dinner,link,bookingLink,pros,cons,chosen,editor,ts}, ... ] }
let plans = {};     // { "1/23": [ {id,time,title,note,editor,ts}, ... ] }
DATES.forEach(d => { hotels[d] = []; plans[d] = []; });

/* ============ 3. 暱稱 ============ */
const nameInput = document.getElementById('userNameInput');
nameInput.value = localStorage.getItem('trip_username') || '';
nameInput.addEventListener('change', () => localStorage.setItem('trip_username', nameInput.value.trim()));
function getEditor(){ return nameInput.value.trim() || '匿名旅人'; }

/* ============ 4. 本機儲存 fallback（未設定 Firebase 時）============ */
const LOCAL_KEY = 'trip_planner_local_v1';
function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw){ const d = JSON.parse(raw); hotels = d.hotels || hotels; plans = d.plans || plans; }
  }catch(e){}
}
function saveLocal(){ localStorage.setItem(LOCAL_KEY, JSON.stringify({hotels, plans})); }

/* ============ 5. Firestore 讀寫 ============ */
function watchFirestore(){
  db.collection('trip_data').doc('hotels').onSnapshot(snap=>{
    if(snap.exists){ hotels = snap.data().byDate || hotels; render(); }
  });
  db.collection('trip_data').doc('plans').onSnapshot(snap=>{
    if(snap.exists){ plans = snap.data().byDate || plans; render(); }
  });
  document.getElementById('statusText').textContent = '即時同步中';
}
function persist(){
  if(isConfigured && db){
    db.collection('trip_data').doc('hotels').set({byDate: hotels});
    db.collection('trip_data').doc('plans').set({byDate: plans});
  } else {
    saveLocal();
  }
  render();
}

/* ============ 6. Render ============ */
const board = document.getElementById('board');

function dateIndex(d){ return DATES.indexOf(d); }

function render(){
  board.innerHTML = '';
  DATES.forEach((d, idx) => {
    const col = document.createElement('div');
    col.className = 'day-col';
    col.innerHTML = `
      <div class="day-head">
        <div class="d1">${d}</div>
        <div class="d2">Day ${idx+1}</div>
      </div>
      <div class="col-section">
        <h3>🏨 飯店候選 <button class="add-mini" data-add-hotel="${d}">＋</button></h3>
        <div class="drop-zone hotel-zone" data-date="${d}"></div>
        <h3 style="margin-top:14px;">📍 當天行程 <button class="add-mini" data-add-plan="${d}">＋</button></h3>
        <div class="drop-zone plan-zone" data-date="${d}"></div>
      </div>
    `;
    board.appendChild(col);

    const hzone = col.querySelector('.hotel-zone');
    (hotels[d] || []).filter(h => h.startDate === d).forEach(h => hzone.appendChild(renderHotelCard(h, d)));

    const pzone = col.querySelector('.plan-zone');
    (plans[d] || []).forEach(p => pzone.appendChild(renderPlanCard(p, d)));

    new Sortable(hzone, { group:'hotels-'+d, animation:150, onEnd: ()=>reorderHotels(d, hzone) });
    new Sortable(pzone, { group:'plans-'+d, animation:150, onEnd: ()=>reorderPlans(d, pzone) });
  });

  board.querySelectorAll('[data-add-hotel]').forEach(b=> b.onclick = () => openHotelDialog(null, b.dataset.addHotel));
  board.querySelectorAll('[data-add-plan]').forEach(b=> b.onclick = () => openPlanDialog(null, b.dataset.addPlan));

  renderSummary();
}

function spanLabel(h){
  return h.nights > 1 ? `<span class="span-badge">住 ${h.nights} 晚</span>` : '';
}

function renderHotelCard(h, d){
  const el = document.createElement('div');
  el.className = 'hotel-card' + (h.chosen ? ' chosen' : '');
  el.dataset.id = h.id;
  const metaBits = [];
  if(h.capacity) metaBits.push(`<span class="tag">👥 ${h.capacity}人</span>`);
  if(h.breakfast) metaBits.push(`<span class="tag">🍳 含早餐</span>`);
  if(h.dinner) metaBits.push(`<span class="tag">🍽️ 含晚餐</span>`);
  el.innerHTML = `
    <div class="card-title">${escapeHtml(h.name)} ${spanLabel(h)}</div>
    <div class="card-meta">${metaBits.join('')}</div>
    ${h.price ? `<div class="price-tag">$${Number(h.price).toLocaleString()}</div>` : ''}
    ${h.pros ? `<div class="card-sub">👍 ${escapeHtml(h.pros)}</div>` : ''}
    ${h.cons ? `<div class="card-sub">👎 ${escapeHtml(h.cons)}</div>` : ''}
    <div class="card-actions">
      ${h.link ? `<a href="${escapeAttr(h.link)}" target="_blank" rel="noopener">介紹</a>` : ''}
      ${h.bookingLink ? `<a href="${escapeAttr(h.bookingLink)}" target="_blank" rel="noopener">訂房</a>` : ''}
      <button class="pick-btn" data-pick="${h.id}" data-date="${d}">${h.chosen ? '取消選定' : '選這間'}</button>
      <button data-edit-hotel="${h.id}" data-date="${d}">編輯</button>
      <button class="del-btn" data-del-hotel="${h.id}" data-date="${d}">刪除</button>
    </div>
    ${h.editor ? `<div class="meta-edit">最後編輯：${escapeHtml(h.editor)}</div>` : ''}
  `;
  el.querySelector('[data-pick]').onclick = () => toggleChosen(d, h.id);
  el.querySelector('[data-edit-hotel]').onclick = () => openHotelDialog(h, d);
  el.querySelector('[data-del-hotel]').onclick = () => { if(confirm(`確定刪除「${h.name}」嗎？`)) deleteHotel(d, h.id); };
  return el;
}

function renderPlanCard(p, d){
  const el = document.createElement('div');
  el.className = 'plan-card';
  el.dataset.id = p.id;
  el.innerHTML = `
    ${p.time ? `<div class="pc-time">${escapeHtml(p.time)}</div>` : ''}
    <div class="card-title">${escapeHtml(p.title)}</div>
    ${p.note ? `<div class="card-sub">${escapeHtml(p.note)}</div>` : ''}
    <div class="card-actions">
      <button data-edit-plan="${p.id}" data-date="${d}">編輯</button>
      <button class="del-btn" data-del-plan="${p.id}" data-date="${d}">刪除</button>
    </div>
    ${p.editor ? `<div class="meta-edit">最後編輯：${escapeHtml(p.editor)}</div>` : ''}
  `;
  el.querySelector('[data-edit-plan]').onclick = () => openPlanDialog(p, d);
  el.querySelector('[data-del-plan]').onclick = () => { if(confirm('確定刪除這筆行程嗎？')) deletePlan(d, p.id); };
  return el;
}

function renderSummary(){
  const grid = document.getElementById('summary-grid');
  grid.innerHTML = '';
  let count = 0, total = 0;
  DATES.forEach(d => {
    const chosen = (hotels[d]||[]).find(h => h.chosen);
    const item = document.createElement('div');
    if(chosen){
      count++; total += Number(chosen.price)||0;
      item.className = 'sum-item';
      item.innerHTML = `<div class="sum-date">${d}</div><div class="sum-hotel">${escapeHtml(chosen.name)}</div>${chosen.price ? `<div class="sum-price">$${Number(chosen.price).toLocaleString()}</div>`:''}`;
    } else {
      item.className = 'sum-item empty';
      item.innerHTML = `<div class="sum-date">${d}</div><div>尚未選定</div>`;
    }
    grid.appendChild(item);
  });
  document.getElementById('chosen-count').textContent = count;
  document.getElementById('total-price').textContent = total.toLocaleString();
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ============ 7. CRUD ============ */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function upsertHotel(data){
  const d = data.startDate;
  if(!hotels[d]) hotels[d] = [];
  const idx = hotels[d].findIndex(h => h.id === data.id);
  if(idx >= 0) hotels[d][idx] = data; else hotels[d].push(data);
  persist();
}
function deleteHotel(d, id){
  hotels[d] = (hotels[d]||[]).filter(h => h.id !== id);
  persist();
}
function toggleChosen(d, id){
  (hotels[d]||[]).forEach(h => { if(h.id === id) h.chosen = !h.chosen; });
  persist();
}
function reorderHotels(d, zone){
  const order = [...zone.children].map(c => c.dataset.id);
  const list = hotels[d] || [];
  list.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id));
  hotels[d] = list;
  persist();
}

function upsertPlan(data){
  const d = data.date;
  if(!plans[d]) plans[d] = [];
  const idx = plans[d].findIndex(p => p.id === data.id);
  if(idx >= 0) plans[d][idx] = data; else plans[d].push(data);
  persist();
}
function deletePlan(d, id){
  plans[d] = (plans[d]||[]).filter(p => p.id !== id);
  persist();
}
function reorderPlans(d, zone){
  const order = [...zone.children].map(c => c.dataset.id);
  const list = plans[d] || [];
  list.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id));
  plans[d] = list;
  persist();
}

/* ============ 8. 對話框 ============ */
const hotelDialog = document.getElementById('hotelDialog');
const hotelForm = document.getElementById('hotelForm');
document.getElementById('hotelCancel').onclick = () => hotelDialog.close();

function openHotelDialog(h, date){
  document.getElementById('hotelDialogTitle').textContent = h ? '編輯飯店候選' : '新增飯店候選';
  document.getElementById('h_id').value = h ? h.id : uid();
  document.getElementById('h_startDate').value = date;
  document.getElementById('h_name').value = h ? h.name : '';
  document.getElementById('h_nights').value = h ? h.nights : 1;
  document.getElementById('h_capacity').value = h ? (h.capacity||'') : '';
  document.getElementById('h_price').value = h ? (h.price||'') : '';
  document.getElementById('h_breakfast').checked = h ? !!h.breakfast : false;
  document.getElementById('h_dinner').checked = h ? !!h.dinner : false;
  document.getElementById('h_link').value = h ? (h.link||'') : '';
  document.getElementById('h_bookingLink').value = h ? (h.bookingLink||'') : '';
  document.getElementById('h_pros').value = h ? (h.pros||'') : '';
  document.getElementById('h_cons').value = h ? (h.cons||'') : '';
  hotelDialog.showModal();
}
hotelForm.addEventListener('submit', (e) => {
  const startDate = document.getElementById('h_startDate').value;
  const existingId = document.getElementById('h_id').value;
  let chosenState = false;
  DATES.forEach(d => { const f = (hotels[d]||[]).find(x=>x.id===existingId); if(f) chosenState = f.chosen; });
  const data = {
    id: existingId,
    startDate,
    name: document.getElementById('h_name').value.trim(),
    nights: Math.max(1, Math.min(9, parseInt(document.getElementById('h_nights').value)||1)),
    capacity: document.getElementById('h_capacity').value,
    price: document.getElementById('h_price').value,
    breakfast: document.getElementById('h_breakfast').checked,
    dinner: document.getElementById('h_dinner').checked,
    link: document.getElementById('h_link').value.trim(),
    bookingLink: document.getElementById('h_bookingLink').value.trim(),
    pros: document.getElementById('h_pros').value.trim(),
    cons: document.getElementById('h_cons').value.trim(),
    chosen: chosenState,
    editor: getEditor(),
    ts: Date.now()
  };
  // 若原本存在別的日期(理論上不會，因為 startDate 固定)，先移除舊資料再放回
  DATES.forEach(d => { hotels[d] = (hotels[d]||[]).filter(x => x.id !== data.id); });
  hotels[startDate].push(data);
  upsertHotel(data);
});

const planDialog = document.getElementById('planDialog');
const planForm = document.getElementById('planForm');
document.getElementById('planCancel').onclick = () => planDialog.close();

function openPlanDialog(p, date){
  document.getElementById('p_id').value = p ? p.id : uid();
  document.getElementById('p_date').value = date;
  document.getElementById('p_time').value = p ? (p.time||'') : '';
  document.getElementById('p_title').value = p ? p.title : '';
  document.getElementById('p_note').value = p ? (p.note||'') : '';
  planDialog.showModal();
}
planForm.addEventListener('submit', (e) => {
  const data = {
    id: document.getElementById('p_id').value,
    date: document.getElementById('p_date').value,
    time: document.getElementById('p_time').value.trim(),
    title: document.getElementById('p_title').value.trim(),
    note: document.getElementById('p_note').value.trim(),
    editor: getEditor(),
    ts: Date.now()
  };
  upsertPlan(data);
});

/* ============ 9. 匯出 ============ */
document.getElementById('exportBtn').onclick = () => {
  let text = `📌 旅程住宿總覽 (1/23–1/31)\n\n`;
  DATES.forEach(d => {
    const chosen = (hotels[d]||[]).find(h => h.chosen);
    text += `${d}：` + (chosen ? `${chosen.name}${chosen.price ? '（$'+Number(chosen.price).toLocaleString()+'）':''}` : '尚未選定') + `\n`;
  });
  navigator.clipboard.writeText(text).then(()=> alert('已複製到剪貼簿！可以貼到 LINE 群組。'));
};

/* ============ 10. 啟動 ============ */
if(isConfigured && db){
  watchFirestore();
} else {
  loadLocal();
  render();
}
